<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blog - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="navbar">

            <h1>
                My Blog
            </h1>

            <nav>

                <a href="/">
                    Home
                </a>

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

                <a href="/dashboard">
                    Dashboard
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         LOGIN SECTION
    ========================== -->

    <main>

        <section class="login-section">

            <h2>
                Login
            </h2>

            <p>
                Login to access your blog dashboard.
            </p>


            <form
                id="loginForm"
                action="/login"
                method="POST"
            >

                <!-- Email -->

                <div>

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div>

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Submit -->

                <button type="submit">
                    Login
                </button>

            </form>


            <p>

                Don't have an account?

                <a href="/register">
                    Register here
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            &copy; 2026 My Blog.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
