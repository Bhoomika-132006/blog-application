<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blog - Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="navbar">

            <h1>
                My Blog
            </h1>

            <nav>

                <a href="/">
                    Home
                </a>

                <a href="/login">
                    Login
                </a>

                <a href="/register">
                    Register
                </a>

                <a href="/dashboard">
                    Dashboard
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         REGISTER SECTION
    ========================== -->

    <main>

        <section class="register-section">

            <h2>
                Create an Account
            </h2>

            <p>
                Register to create and share your blogs.
            </p>


            <form
                id="registerForm"
                action="/register"
                method="POST"
            >

                <!-- Name -->

                <div>

                    <label for="registerName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- Email -->

                <div>

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div>

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Submit -->

                <button type="submit">
                    Register
                </button>

            </form>


            <p>

                Already have an account?

                <a href="/login">
                    Login here
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            &copy; 2026 My Blog.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
