<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blog - Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header>

        <div class="navbar">

            <h1>My Blog</h1>

            <nav>

                <a href="/">
                    Home
                </a>

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/create-blog">
                    Create Blog
                </a>

                <a href="/login">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <main class="container">

        <div class="dashboard-header">

            <div>

                <h2>
                    Dashboard
                </h2>

                <p id="welcomeUser">
                    Welcome to your blog dashboard!
                </p>

            </div>


            <a
                href="/create-blog"
                class="btn"
            >
                + Create Blog
            </a>

        </div>


        <!-- =========================
             BLOG SECTION
        ========================== -->

        <h2 class="section-title">
            All Blogs
        </h2>


        <div
            id="dashboardBlogs"
            class="blog-container"
        >

            <!-- BLOGS WILL BE INSERTED BY NODE.JS -->

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            &copy; 2026 My Blog.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
